version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    labels:
      - "type: dependencies"
      - "status: needs-review"
    reviewers:
      - "c2tz"
    assignees:
      - "c2tz"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Keep compatible families together; supported major updates remain separate PRs.
    ignore:
      # Node types follow the supported runtime; lint/check peers need coordinated migrations.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-astro"
        update-types: ["version-update:semver-major"]
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "sharp"
        update-types: ["minor", "patch"]
      lint-typescript:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "typescript"
          - "typescript-eslint"
        update-types: ["minor", "patch"]
      video:
        patterns:
          - "@mux/*"
          - "media-chrome"
        update-types: ["minor", "patch"]
      browser-qa:
        patterns:
          - "@playwright/test"
          - "@lhci/*"
        update-types: ["minor", "patch"]
      formatting:
        patterns:
          - "prettier"
          - "prettier-plugin-*"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:30"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    labels:
      - "type: dependencies"
      - "area: tooling"
      - "status: needs-review"
    reviewers:
      - "c2tz"
    assignees:
      - "c2tz"
    commit-message:
      prefix: "chore"
      include: "scope"
