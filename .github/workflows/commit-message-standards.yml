name: Commit message standards

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: commit-message-standards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pull-request-title:
    name: Validate pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Mark pull request title validation as not applicable
        if: github.event_name != 'pull_request'
        run: echo "Pull request title validation is not applicable to push events."

      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup project
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-project

      - name: Validate title with commitlint
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm lint:commit

  validate-pushed-commit:
    name: Validate pushed commit message
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Validate all pushed commit messages
        shell: bash
        env:
          PUSH_AFTER: ${{ github.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            echo "::error::Protected branches must have a previous commit SHA."
            exit 1
          fi

          if ! git cat-file -e "$PUSH_BEFORE^{commit}"; then
            echo "::error::The previous push commit is unavailable, so the introduced commit range cannot be validated."
            exit 1
          fi

          range="${PUSH_BEFORE}..${PUSH_AFTER}"

          commits="$(git rev-list --reverse "$range")"
          if [[ -z "$commits" ]]; then
            echo "No newly introduced commits need validation."
            exit 0
          fi

          while IFS= read -r commit; do
            echo "::group::Commit $commit"
            git show -s --format=%B "$commit" | pnpm lint:commit
            echo "::endgroup::"
          done <<< "$commits"
