name: Smoke Vercel preview deployment

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Public Vercel preview origin, for example https://deployment.vercel.app/"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-preview-smoke-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  smoke-preview:
    name: Smoke deployed Vercel preview
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        vars.VERCEL_PREVIEW_SMOKE_ENABLED == 'true' &&
        github.event.deployment_status.state == 'success' &&
        github.event.deployment.environment == 'Preview'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout trusted default-branch smoke code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          ignore-scripts: "true"

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify the deployed preview
        env:
          VERCEL_PREVIEW_URL: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.preview_url || github.event.deployment_status.environment_url }}
        run: node scripts/smoke-vercel-preview.mjs
