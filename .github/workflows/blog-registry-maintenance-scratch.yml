name: Blog production HTTP smoke
on:
  push:
    branches: [maintenance/blog-registry-scratch-20261125]
permissions: {}
jobs:
  smoke-production:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public homepage and robots response
        shell: bash
        run: |
          set -euo pipefail
          origin=https://ct-blog.cta.li
          curl --proto '=https' --connect-timeout 10 --max-time 25 --fail --silent --show-error -D /tmp/blog-home-headers -o /tmp/blog-home "$origin/"
          grep -E '^HTTP/' /tmp/blog-home-headers | tail -1
          grep -Ei '^content-type: text/html' /tmp/blog-home-headers
          grep -Eiq '<html([[:space:]>])' /tmp/blog-home
          curl --proto '=https' --connect-timeout 10 --max-time 25 --fail --silent --show-error -D /tmp/blog-robots-headers -o /tmp/blog-robots "$origin/robots.txt"
          grep -E '^HTTP/' /tmp/blog-robots-headers | tail -1
          grep -q '^User-agent:' /tmp/blog-robots
          echo "Blog homepage returned HTML; robots.txt responded as expected."
