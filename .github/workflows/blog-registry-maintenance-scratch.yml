name: Blog registry maintenance snapshot
on:
  push:
    branches: [maintenance/blog-registry-scratch-20261125]
permissions:
  contents: read
jobs:
  dependency-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
      - name: Compare direct dependency versions
        shell: bash
        run: |
          rc=0
          pnpm outdated --format json > /tmp/blog-outdated.json || rc=$?
          test "$rc" -le 1
          echo BLOG_INVENTORY_BEGIN
          cat /tmp/blog-outdated.json
          echo BLOG_INVENTORY_END
      - name: Resolve verified current TypeScript ESLint update
        shell: bash
        run: |
          pnpm up typescript-eslint@8.74.0 --lockfile-only --ignore-scripts
          echo BLOG_PATCH_BEGIN
          git --no-pager diff --no-color -- package.json pnpm-lock.yaml
          echo BLOG_PATCH_END
