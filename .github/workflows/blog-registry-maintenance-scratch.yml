name: Blog post-deployment HTTP smoke
on:
  push:
    branches: [maintenance/blog-registry-scratch-20261125]
permissions: {}
jobs:
  smoke-production:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify the public production response without bypass
        shell: bash
        run: |
          set -euo pipefail
          origin=https://ct-blog.cta.li
          status=$(curl --proto '=https' --connect-timeout 10 --max-time 25 --silent --show-error -D /tmp/blog-home-headers -o /tmp/blog-home -w '%{http_code}' "$origin/")
          echo "GET /: HTTP $status"
          grep -Ei '^(content-type|server|x-vercel-mitigated|x-vercel-id|x-vercel-cache):' /tmp/blog-home-headers || true
          test "$status" = 200
          grep -Eiq '<html([[:space:]>])' /tmp/blog-home
          status=$(curl --proto '=https' --connect-timeout 10 --max-time 25 --silent --show-error -o /tmp/blog-robots -w '%{http_code}' "$origin/robots.txt")
          echo "GET /robots.txt: HTTP $status"
          test "$status" = 200
          grep -q '^User-agent:' /tmp/blog-robots
