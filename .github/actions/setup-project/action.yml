name: Setup project
description: Install the pinned Node.js and pnpm versions and locked dependencies.

inputs:
  ignore-scripts:
    description: Disable dependency lifecycle scripts for the trusted preview smoke job.
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 11.1.3

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 22.22.3
        cache: pnpm

    - name: Install dependencies
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        args=(--frozen-lockfile)
        if [[ "$IGNORE_SCRIPTS" == "true" ]]; then
          args+=(--ignore-scripts)
        fi
        pnpm install "${args[@]}"
